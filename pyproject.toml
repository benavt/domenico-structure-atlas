[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "domenico-structure-atlas"
version = "0.1.0"
requires-python = ">=3.11"
description = "Frozen RBP, 5NTase and SERCA structure analysis and saved-result publication"
dependencies = [
  "structure-clustering @ git+https://github.com/benavt/Structure_Clustering.git@c7f5bc42e015d5e7faa9e6c85bd830cb88ede570",
]

[project.optional-dependencies]
analysis = ["structure-clustering[desktop]"]

[tool.setuptools]
packages = []
